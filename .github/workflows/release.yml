name: Release

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string

      release-branch:
        type: string
        default: 'main'

    outputs:
      release-version:
        description: 'Maven project version that was released (without the -SNAPSHOT suffix)'
        value: ${{ jobs.release.outputs.release-version }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "${{ inputs.release-branch }}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          server-id: github
          server-username: MAVEN_USER
          server-password: MAVEN_TOKEN
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Capture release version
        id: version
        env:
          MAVEN_USER: ${{ vars.MAVEN_USER }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: |
          CURRENT_VERSION=$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=${CURRENT_VERSION%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Configure Git user
        env:
          GITHUB_CI_USER: MhikesCI
          GITHUB_CI_EMAIL: ops@mhikes.com

        run: |
          git config --global user.name "$GITHUB_CI_USER"
          git config --global user.email "$GITHUB_CI_EMAIL"

      - name: Publish package to GitHub Packages
        id: build
        env:
          MAVEN_USER: ${{ vars.MAVEN_USER }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: |
          ./mvnw --batch-mode release:prepare release:perform

      - uses: actions/upload-artifact@v4
        with:
          name: built-jars
          # release:perform builds the tagged release in a nested checkout (target/checkout by default)
          path: "target/checkout/**/target/*.jar"
          retention-days: 1
